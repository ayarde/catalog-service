ext {
    set('testcontainers.version', '1.21.4')
}

import org.springframework.boot.gradle.plugin.SpringBootPlugin

apply plugin: 'io.spring.dependency-management'

dependencyManagement {
    imports {
        mavenBom "org.springframework.boot:spring-boot-dependencies:${springBootVersion}"
    }
}

// ─── Source Set: Integration Tests ───────────────────────────────────────────
sourceSets {
    intTest {
        // Compila usando los outputs de main y test, más las classpaths de compilación de ambos
        compileClasspath += sourceSets.main.output + sourceSets.test.output + sourceSets.main.compileClasspath + sourceSets.test.compileClasspath

        // Corre usando todo lo anterior más las classpaths de ejecución de ambos
        runtimeClasspath += output + sourceSets.main.output + sourceSets.test.output + sourceSets.main.runtimeClasspath + sourceSets.test.runtimeClasspath

        java.srcDir 'src/intTest/java'
        resources.srcDir 'src/intTest/resources'
    }
}

configurations {
    intTestImplementation.extendsFrom testImplementation
    intTestRuntimeOnly.extendsFrom testRuntimeOnly
}

tasks.named('processIntTestResources', ProcessResources) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.register('intTest', Test) {
    description = 'Ejecuta integration tests con Testcontainers. Requiere -DdoIntegrationTest=true'
    group = 'verification'
    testClassesDirs = sourceSets.intTest.output.classesDirs
    classpath = sourceSets.intTest.runtimeClasspath
    useJUnitPlatform()

    environment 'DOCKER_API_VERSION', '1.44'
    // Disable JaCoCo for integration tests to avoid JVM agent issues on Java 25
    jacoco.enabled = false
}

tasks.named('check') {
    if (project.hasProperty('doIntegrationTest') && project.doIntegrationTest.toBoolean()) {
        dependsOn intTest
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    violationRules {
        rule {
            limit {
                minimum = 0.80
            }
        }
    }
}

check.dependsOn jacocoTestCoverageVerification
// ─────────────────────────────────────────────────────────────────────────────

dependencies {

    // Dependencia de las reglas de negocio y aplicación
    implementation project(':domain')
    implementation project(':application')

    // Web, Persistencia (MongoDB), Mensajería y Caché
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-tracing'
    implementation "io.github.resilience4j:resilience4j-spring-boot3:${resilience4jVersion}"
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'

    // Generador de IDs (TSID)
    implementation "io.hypersistence:hypersistence-tsid:${tsidVersion}"

    // Testing — Unit Tests
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Testing — Integration Tests (Testcontainers)
    intTestImplementation 'org.springframework.boot:spring-boot-starter-test'
    intTestImplementation 'org.springframework.boot:spring-boot-testcontainers'
    intTestImplementation 'org.testcontainers:junit-jupiter'
    intTestImplementation 'org.testcontainers:mongodb'
    intTestImplementation 'org.testcontainers:rabbitmq'
    intTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}