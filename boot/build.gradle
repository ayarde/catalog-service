plugins {
    id 'org.springframework.boot'
    id 'io.spring.dependency-management'
    id 'java'
}

dependencies {
    implementation project(':domain')
    implementation project(':application')
    implementation project(':infrastructure')
    
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation "io.github.resilience4j:resilience4j-spring-boot3:${resilience4jVersion}"
    implementation "io.github.resilience4j:resilience4j-micrometer:${resilience4jVersion}"
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-cache'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
    
    // --- OBSERVABILIDAD ---
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'io.micrometer:micrometer-registry-prometheus'
    
    // Trazabilidad Distribuida (Spring Boot 3 usa Micrometer Tracing)
    implementation 'io.micrometer:micrometer-tracing-bridge-brave'
    implementation 'io.zipkin.reporter2:zipkin-reporter-brave'
    
    // Codificación de Logs en JSON para Observabilidad Escalar
    implementation "net.logstash.logback:logstash-logback-encoder:${logstashEncoderVersion}"
    // ----------------------
    
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

springBoot {
    buildInfo()
}

bootJar {
    archiveBaseName = 'catalog-service'
    archiveVersion = project.version
}

jar {
    enabled = false
}

tasks.register('dockerBuild', Exec) {
    description = 'Construye imagen Docker local del servicio'
    group = 'docker'
    dependsOn bootJar

    workingDir = projectDir

    commandLine 'docker', 'build', '-t',
            "catalog-service:${project.version}",
            '--build-arg', "JAR_FILE=${bootJar.archiveFileName.get()}",
            '.'
}