import java.util.concurrent.atomic.AtomicInteger
import org.gradle.api.tasks.testing.Test
import org.gradle.api.tasks.testing.TestResult
import org.gradle.api.tasks.testing.logging.TestLogEvent

plugins {
    id 'org.springframework.boot' version "${springBootVersion}" apply false
    id 'io.spring.dependency-management' version "${dependencyManagementVersion}" apply false
    id 'java'
}

// Validación de versión de Java para evitar fallos de ejecución (Alineado con Toolchain)
if (JavaVersion.current() < JavaVersion.VERSION_25) {
    throw new GradleException("Este proyecto está diseñado para Java 25. Por favor, asegúrate de que Gradle esté usando JDK 25. Versión actual: ${JavaVersion.current()}")
}

allprojects {
    group = project.group
    version = project.version

    repositories {
        mavenCentral()
    }
}

subprojects {
    // Apply common plugins to all modules (java, java-library, jacoco already applied)
    // ---------------------------------------------------------------------
    // Global test logging configuration (applies to every Test task in every sub‑project)
    tasks.withType(Test).configureEach { testTask ->
        def isLocal = project.hasProperty('showTestLogs') || System.getenv('CI') == null
        if (isLocal) {
            testLogging {
                events "started", "passed", "skipped", "failed"
                showStandardStreams = true
                exceptionFormat "full"
            }
        } else {
            // CI: concise summary + JSON for failures only
            testLogging {
                events "passed", "failed", "skipped"
                showStandardStreams = false
            }
            afterTest { desc, result ->
                if (result.resultType == org.gradle.api.tasks.testing.TestResult.ResultType.FAILURE) {
                    def json = groovy.json.JsonOutput.toJson([
                        className: desc.className,
                        testName : desc.name,
                        result   : result.resultType.name(),
                        started  : result.startTime,
                        ended    : result.endTime,
                        failure  : result.exception?.message
                    ])
                    println json
                }
            }
        }
    }

    apply plugin: 'java'
    apply plugin: 'java-library'
    apply plugin: 'jacoco'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(25)
        }
    }

    tasks.withType(JavaCompile) {
        options.encoding = 'UTF-8'
        options.compilerArgs.add('-parameters')
    }

    tasks.named('test', Test) {
        useJUnitPlatform()
        finalizedBy jacocoTestReport
    }

    jacocoTestCoverageVerification {
        dependsOn test
        violationRules {
            rule {
                limit {
                    minimum = 0.80
                }
            }
        }
    }

    check.dependsOn jacocoTestCoverageVerification

// JaCoCo report generation is now compatible with Java 25
// No need to disable JaCoCo for Test tasks
}
// ---------------------------------------------------------------------
// CI wrapper tasks (global)
// ---------------------------------------------------------------------

// Wrapper that runs ONLY the integration tests defined in the 'application' module
tasks.register('ciIntTest') {
    description = 'Run integration tests from the application module.'
    group = 'verification'
    dependsOn ':application:intTest'
    doFirst {
        if (!System.getenv('CI')) {
            logger.lifecycle('Setting CI=true for this wrapper run')
            System.setProperty('CI', 'true')
        }
    }
}

// Wrapper that runs ALL unit tests + the integration tests (CI mode)
// It respects the optional -PfailFast property (default true in CI)
tasks.register('ciTest') {
    description = 'Run all unit tests and the application integration tests with CI settings.'
    group = 'verification'

    // Ensure CI mode (in case the CI system does not set CI env var)
    doFirst {
        if (!System.getenv('CI')) {
            logger.lifecycle('Setting CI=true for this run')
            System.setProperty('CI', 'true')
        }
        // Apply fail‑fast if the property is present and true (default true in CI)
        if (project.hasProperty('failFast') ? project.failFast.toBoolean() : true) {
            gradle.startParameter.continueOnFailure = false
        }
    }

    // Run unit tests of EVERY sub‑project
    dependsOn subprojects.collect { sub -> sub.tasks.matching { it.name == 'test' } }.flatten()
    // Run the integration tests (only application defines them)
    dependsOn 'ciIntTest'
}
// ---------------------------------------------------------------------
// Versioning tasks (semver)
// ---------------------------------------------------------------------

def versionFile = file('gradle.properties')
def versionPattern = /(?m)^version=(.*)$/

ext.parseSemver = { String v ->
    def matcher = v =~ /^(\d+)\.(\d+)\.(\d+)(-SNAPSHOT)?$/
    if (!matcher) throw new GradleException("Formato de versión inválido: $v")
    [major: matcher[0][1] as int, minor: matcher[0][2] as int,
     patch: matcher[0][3] as int, snapshot: matcher[0][4] != null]
}

ext.writeVersion = { String newVersion ->
    def replaced = versionFile.text.replaceAll(versionPattern, "version=$newVersion")
    versionFile.text = replaced
    logger.lifecycle("Versión actualizada: $newVersion")
}

tasks.register('printVersion') {
    description = 'Muestra la versión actual del proyecto'
    group = 'versioning'
    doLast { println project.version }
}

tasks.register('bumpMajor') {
    description = 'Incrementa major version (1.0.0 -> 2.0.0-SNAPSHOT)'
    group = 'versioning'
    doLast {
        def v = parseSemver(project.version.toString())
        writeVersion("${v.major + 1}.0.0-SNAPSHOT")
    }
}

tasks.register('bumpMinor') {
    description = 'Incrementa minor version (1.0.0 -> 1.1.0-SNAPSHOT)'
    group = 'versioning'
    doLast {
        def v = parseSemver(project.version.toString())
        writeVersion("${v.major}.${v.minor + 1}.0-SNAPSHOT")
    }
}

tasks.register('bumpPatch') {
    description = 'Incrementa patch version (1.0.0 -> 1.0.1-SNAPSHOT)'
    group = 'versioning'
    doLast {
        def v = parseSemver(project.version.toString())
        writeVersion("${v.major}.${v.minor}.${v.patch + 1}-SNAPSHOT")
    }
}

tasks.register('release') {
    description = 'Elimina -SNAPSHOT (1.0.0-SNAPSHOT -> 1.0.0)'
    group = 'versioning'
    doLast {
        def v = parseSemver(project.version.toString())
        writeVersion("${v.major}.${v.minor}.${v.patch}")
    }
}

tasks.register('snapshot') {
    description = 'Agrega -SNAPSHOT si no lo tiene (1.0.0 -> 1.0.0-SNAPSHOT)'
    group = 'versioning'
    doLast {
        def current = project.version.toString()
        if (!current.endsWith('-SNAPSHOT')) {
            writeVersion("$current-SNAPSHOT")
        }
    }
}

// ---------------------------------------------------------------------
// Documentation tasks
// ---------------------------------------------------------------------

tasks.register('updateReadme') {
    description = 'Actualiza la seccion de versionado y Docker en README.md'
    group = 'documentation'
    doLast {
        def readme = file('README.md')
        def content = readme.text
        def markerStart = '## Versionado'
        def markerEnd = '<!-- end-versioning -->'
        def section = '''## Versionado

El proyecto usa [Semantic Versioning](https://semver.org) con soporte para snapshots.

### Comandos disponibles

| Comando | Descripcion |
|---------|-------------|
| `./gradlew printVersion` | Muestra la version actual del proyecto |
| `./gradlew bumpMajor` | Incrementa major (1.0.0 -> 2.0.0-SNAPSHOT) |
| `./gradlew bumpMinor` | Incrementa minor (1.0.0 -> 1.1.0-SNAPSHOT) |
| `./gradlew bumpPatch` | Incrementa patch (1.0.0 -> 1.0.1-SNAPSHOT) |
| `./gradlew release` | Quita -SNAPSHOT (1.0.0-SNAPSHOT -> 1.0.0) |
| `./gradlew snapshot` | Agrega -SNAPSHOT si no lo tiene |
| `./gradlew -Pversion=X.Y.Z bootJar` | Build con version custom |
| `./gradlew :boot:dockerBuild` | Construye imagen Docker local |
| `./gradlew bootJar` | Genera JAR ejecutable en build/libs/ |

### Ejemplos de uso

```bash
# Version custom para testing
./gradlew -Pversion=1.0.0-RC1 bootJar

# Release completo
./gradlew bumpPatch && ./gradlew release && ./gradlew bootJar

# Imagen Docker
./gradlew -Pversion=1.0.0 :boot:dockerBuild
# -> docker image catalog-service:1.0.0
```

''' + markerEnd

        if (content.contains(markerStart)) {
            content = content.replaceAll(/(?s)$markerStart.*?$markerEnd/, section)
        } else {
            content += "\n\n$section\n"
        }
        readme.text = content
        logger.lifecycle("README.md actualizado con seccion de versionado y Docker")
    }
}

// Ensure check task aggregates conditional integration tests
tasks.named('check') {
    dependsOn subprojects.collect { p -> (p.hasProperty('doIntegrationTest') && p.doIntegrationTest.toBoolean()) ? p.tasks.findByName('intTest') : null }.findAll { it != null }
}
